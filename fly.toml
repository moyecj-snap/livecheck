# Livecheck on Fly.io — long-running paid API, not a static site.
# App name is a suggestion; change it if `livecheck` is taken in your org.

app = "livecheck"
primary_region = "sjc"

[build]

# Public origin for 402 resource.url (https). Not a secret.
[env]
  LIVECHECK_PUBLIC_URL = "https://livecheck.fly.dev"
  PAID_CALL_DB_PATH = "/data/paid-calls.sqlite"
  WATCH_DB_PATH = "/data/watchers.sqlite"
  # Confirm / check / watch / event receipts. Same volume as watchers.
  RECEIPT_DB_PATH = "/data/receipts.sqlite"

# Privacy-safe paid_call + receipt SQLite. Patty must create this volume
# before the first deploy that includes this mount (see README).
# One machine, one livecheck_data volume (Craig: consolidate on snowy-wood).
# Public GET /stats reads that SQLite file. Do not copy volumes together.
[[mounts]]
  source = "livecheck_data"
  destination = "/data"

# Sentinel's scheduler is an in-process poll inside the app process
# (processes = ["app"], Docker CMD npm start). It only runs while this
# machine is up. Do not stop, suspend, or wake-on-request:
#   auto_stop_machines = "off"   — neither stop nor suspend (no sleep)
#   auto_start_machines = false  — no start-on-request sleep cycle
#   min_machines_running = 1     — keep the app process running
[http_service]
  internal_port = 43127
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

# One paid hang took down the 256mb box. Deploys must not shrink it again.
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
