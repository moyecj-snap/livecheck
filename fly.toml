# Livecheck on Fly.io — long-running paid API, not a static site.
# App name is a suggestion; change it if `livecheck` is taken in your org.

app = "livecheck"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 43127
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
