# Livecheck on Fly.io — long-running paid API, not a static site.
# App name is a suggestion; change it if `livecheck` is taken in your org.

app = "livecheck"
primary_region = "sjc"

[build]

# Public origin for 402 resource.url (https). Not a secret.
[env]
  LIVECHECK_PUBLIC_URL = "https://livecheck.fly.dev"
  PAID_CALL_DB_PATH = "/data/paid-calls.sqlite"
  WATCH_DB_PATH = "/data/watchers.sqlite"

# Privacy-safe paid_call SQLite. Patty must create this volume before the
# first deploy that includes this mount (see README). Single machine only.
[[mounts]]
  source = "livecheck_data"
  destination = "/data"

[http_service]
  internal_port = 43127
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
